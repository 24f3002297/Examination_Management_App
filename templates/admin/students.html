{% extends "admin/admin_base.html" %}
{% block title %}Students{% endblock %}

{% block admin_content %}
<h1>All Students</h1>

<table>
  <tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th></tr>
  {% for s in students %}
  <tr>
    <td>{{ s.id }}</td>
    <td>{{ s.name }}</td>
    <td>{{ s.email }}</td>
    <td>{{ s.status }}</td>
  </tr>
  {% else %}
  <tr><td colspan="4">No students yet</td></tr>
  {% endfor %}
</table>
{% endblock %}
