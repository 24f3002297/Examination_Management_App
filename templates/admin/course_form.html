{% extends "admin/admin_base.html" %}
{% block title %}Course{% endblock %}

{% block admin_content %}
<h1>{% if course %}Edit Course{% else %}Add Course{% endif %}</h1>

<form method="POST" class="form">
  <label>Course Code</label>
  <input type="text" name="course_code" value="{{ course.course_code if course else '' }}" required>

  <label>Course Name</label>
  <input type="text" name="course_name" value="{{ course.course_name if course else '' }}" required>

  <label>Description</label>
  <input type="text" name="description" value="{{ course.description if course else '' }}" required>

  <label>Status</label>
  <select name="status">
    <option value="active" {% if course and course.status == 'active' %}selected{% endif %}>active</option>
    <option value="inactive" {% if course and course.status == 'inactive' %}selected{% endif %}>inactive</option>
  </select>

  <button type="submit">Save</button>
  <a href="{{ url_for('admin_courses') }}">Cancel</a>
</form>
{% endblock %}
