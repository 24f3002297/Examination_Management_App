{% extends "portal.html" %}
{% set active = 'courses' %}
{% block heading %}{{ 'Edit course' if course else 'Add course' }}{% endblock %}
{% block portal_body %}
<div class="card card-body mb-4 narrow">
    <form method="POST">
        <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">Course code</label>
                <input class="form-control" name="course_code" value="{{ course.course_code if course else '' }}" required></div>
            <div class="col-md-6"><label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="active" {% if course and course.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if course and course.status == 'inactive' %}selected{% endif %}>Inactive</option>
                </select></div>
        </div>
        <div class="mb-3"><label class="form-label">Course name</label>
            <input class="form-control" name="course_name" value="{{ course.course_name if course else '' }}" required></div>
        <div class="mb-3"><label class="form-label">Description</label>
            <input class="form-control" name="description" value="{{ course.description if course else '' }}" required></div>
        <div class="mt-3 d-flex gap-2"><button class="btn btn-primary">Save course</button><a class="btn btn-outline-primary" href="{{ url_for('admin_courses') }}">Cancel</a></div>
    </form>
</div>
{% endblock %}
