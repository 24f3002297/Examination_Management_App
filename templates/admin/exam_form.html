{% extends "portal.html" %}
{% set active = 'exams' %}
{% block heading %}{{ 'Edit exam' if exam else 'Add exam' }}{% endblock %}
{% block portal_body %}
<form method="POST">
<div class="card card-body mb-4 narrow">
    <h3 class="h5 mb-3">Exam details</h3>
    <div class="mb-3"><label class="form-label">Exam name</label>
        <input class="form-control" name="exam_name" value="{{ exam.exam_name if exam else '' }}" required></div>
    <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Course</label>
            <select class="form-select" name="course_id">
                {% for c in courses %}<option value="{{ c.course_id }}" {% if exam and exam.course_id == c.course_id %}selected{% endif %}>{{ c.course_name }}</option>{% endfor %}
            </select></div>
        <div class="col-md-6"><label class="form-label">Exam type</label>
            <input class="form-control" name="exam_type" value="{{ exam.exam_type if exam else '' }}" placeholder="Viva, Practical, Written" required></div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Maximum marks</label>
            <input class="form-control" type="number" step="any" name="max_marks" value="{{ exam.max_marks if exam else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Examiner</label>
            <select class="form-select" name="examiner_id">
                <option value="">Not assigned</option>
                {% for u in examiners %}<option value="{{ u.id }}" {% if exam and exam.examiner_id == u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
            </select></div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Exam start date</label>
            <input class="form-control" type="date" name="exam_start_date" value="{{ exam.exam_start_date if exam else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Exam end date</label>
            <input class="form-control" type="date" name="exam_end_date" value="{{ exam.exam_end_date if exam else '' }}" required></div>
    </div>
</div>

<div class="card card-body mb-4 narrow">
    <h3 class="h5 mb-3">Timeline</h3>
    <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Last day to create slots</label>
            <input class="form-control" type="date" name="slot_creation_deadline" value="{{ exam.slot_creation_deadline if exam and exam.slot_creation_deadline else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Last day to book slots</label>
            <input class="form-control" type="date" name="booking_deadline" value="{{ exam.booking_deadline if exam and exam.booking_deadline else '' }}"></div>
    </div>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="slot_creation_open" {% if exam and exam.slot_creation_open %}checked{% endif %}><label class="form-check-label">Examiner can create slots</label></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="booking_open" {% if exam and exam.booking_open %}checked{% endif %}><label class="form-check-label">Students can book slots</label></div>
    <div class="mt-3 d-flex gap-2"><button class="btn btn-primary">Save exam</button><a class="btn btn-outline-primary" href="{{ url_for('admin_exams') }}">Cancel</a></div>
</div>
</form>
{% endblock %}
