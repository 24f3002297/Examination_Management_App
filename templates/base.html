<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='base.css') }}">

    {% block styles %}{% endblock %}
</head>

<body>
   <div class="page-container">
    <div class="navbar">
        <h2>My Website</h2>

        <div class="links">
            <a href="{{ url_for('info') }}">Info</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('sign_up') }}">Sign Up</a>
        </div>
    </div>

    <main>
      {% block content %}
      {% endblock %}
    </main>

     <footer>
        <p>© 2026 My Website. All rights reserved.</p>
    </footer>
  <div>
</body>
</html>
